x-base-app-build: &base-app-build
  build:
    context: .
    dockerfile: Dockerfile
  image: voenmeh-timetable-bot-app:latest

x-base-app-service: &base-app-service
  <<: *base-app-build
  working_dir: /app
  env_file:
    - .env
  environment:
    TZ: ${TZ:-Europe/Moscow}
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  volumes:
    - ./data:/app/data
  deploy:
    resources:
      limits:
        memory: 2G
      reservations:
        memory: 512M

services:
  migrate:
    <<: *base-app-build
    container_name: voenmeh_migrate
    working_dir: /app
    env_file:
      - .env
    command: ["python", "-m", "core.db.migrate"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  bot:
    <<: *base-app-service
    container_name: voenmeh_bot
    shm_size: 1gb
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      PYTHONPATH: /app

  worker:
    <<: *base-app-service
    container_name: voenmeh_worker
    shm_size: 1gb
    healthcheck:
      disable: true
    depends_on:
      migrate: { condition: service_completed_successfully }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    command: python -m dramatiq --processes ${DRAMATIQ_PROCESSES:-2} --threads ${DRAMATIQ_THREADS:-50} bot.tasks -Q high_priority medium_priority low_priority default
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      PYTHONPATH: /app

  db:
    image: postgres:15-alpine
    container_name: voenmeh_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: [ .env ]
    environment:
      - TZ=${TZ:-Europe/Moscow}
    command: [ "postgres", "-c", "timezone=${DB_TIMEZONE:-Europe/Moscow}", "-c", "log_timezone=${DB_TIMEZONE:-Europe/Moscow}" ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: voenmeh_redis
    volumes:
      - redis_data:/data
    env_file: [ .env ]
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: voenmeh_rabbitmq
    hostname: rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_MEM_RELATIVE: 0.7
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: [ "CMD", "sh", "-c", "rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_port_connectivity" ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.53.0
    container_name: voenmeh_prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerting_rules.yml:/etc/prometheus/alerting_rules.yml:ro
      - prometheus_data:/prometheus
    ports: [ "127.0.0.1:9090:9090" ]
    command: [ '--config.file=/etc/prometheus/prometheus.yml' ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.1.0
    container_name: voenmeh_grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: [ "127.0.0.1:3000:3000" ]
    env_file: [ .env ]
    environment:
      - GF_ALERTING_ENABLED=true
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.26.0
    container_name: voenmeh_alertmanager
    ports: [ "127.0.0.1:9093:9093" ]
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command: [ '--config.file=/etc/alertmanager/alertmanager.yml' ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9093/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3

  loki:
    profiles: ["monitoring"]
    image: grafana/loki:2.9.0
    container_name: voenmeh_loki
    command: [ "-config.file=/etc/loki/local-config.yaml", "-config.expand-env=true" ]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:3100/ready" ]
      interval: 30s
      timeout: 10s
      retries: 3

  promtail:
    profiles: ["monitoring"]
    image: grafana/promtail:2.9.0
    container_name: voenmeh_promtail
    command: [ "-config.file=/etc/promtail/config.yml", "-config.expand-env=true" ]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - promtail_data:/var/lib/promtail/positions
    depends_on:
      - loki
    restart: unless-stopped

  otel-collector:
    profiles: ["monitoring"]
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: voenmeh_otel_collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./otel/collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - loki
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    restart: unless-stopped

  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.6.1
    container_name: voenmeh_node_exporter
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    healthcheck:
      test: [ "CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9100/metrics" ]
      interval: 30s
      timeout: 10s
      retries: 3
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped

  pgadmin:
    profiles: ["tools"]
    image: dpage/pgadmin4:9.6
    container_name: voenmeh_pgadmin
    env_file: [ .env ]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@voenmeh.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_SERVER_JSON_FILE: '/var/lib/pgadmin/servers.json'
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json.template:/pgadmin4/servers.json.template:ro
    entrypoint: >
      /bin/sh -c "
        sed 's/$${POSTGRES_DB}/'\"$$POSTGRES_DB\"'/g; s/$${POSTGRES_USER}/'\"$$POSTGRES_USER\"'/g' /pgadmin4/servers.json.template > /var/lib/pgadmin/servers.json &&
        chmod 644 /var/lib/pgadmin/servers.json &&
        /entrypoint.sh
      "
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_data:
  pgadmin_data:
  rabbitmq_data:
