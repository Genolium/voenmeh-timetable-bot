name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '18'

jobs:
  # Тестирование
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock
        pip install -r requirements-dev.txt

    - name: Wait for databases
      run: |
        timeout 60 bash -c 'until nc -z localhost 5432; do sleep 1; done'
        timeout 60 bash -c 'until nc -z localhost 6379; do sleep 1; done'

    - name: Run migrations
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      run: |
        alembic upgrade head

    - name: Check migrations match models
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      run: |
        alembic check

    - name: Run tests with coverage
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/0
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        RUN_INTEGRATION: "1"
      run: |
        pytest --cov=bot --cov=core --cov-branch --cov-report=xml --cov-report=term-missing --cov-fail-under=100 --tb=short

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # Linting и проверка кода
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-lint-

    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run Black (code formatter)
      run: |
        black --check --diff bot/ core/ tests/ main.py

    - name: Run Flake8 (style checker)
      run: |
        flake8 bot/ core/ tests/ main.py --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 bot/ core/ tests/ main.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run isort (import sorter)
      run: |
        isort --check-only --diff bot/ core/ tests/ main.py

    - name: Run MyPy ratchet
      run: |
        python scripts/check_mypy_ratchet.py

    - name: Run Bandit (security linter)
      run: |
        bandit -r bot/ core/ -f json -o bandit-report.json || true
        bandit -r bot/ core/ -lll -s B324

    - name: Run pip-audit
      run: |
        pip-audit -r requirements.lock

    - name: Run pre-commit hooks
      run: |
        pre-commit run --all-files

  # Проверка сборки Docker-образа
  # Публикации в registry здесь нет: рабочий деплой собирает образ локально
  # (docker compose build), а CI только убеждается, что Dockerfile собирается.
  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'

    env:
      IMAGE_NAME: genolium/voenmeh-timetable-bot

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-

    - name: Build Docker image (verification only)
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64

  # Деплой на staging (ветка dev)
  #
  # Вся конфигурация деплоя — в .env, как и остальные секреты проекта.
  # На раннере без .env используются одноимённые repository secrets.
  # Если не задано ничего — job не падает, а сообщает, что деплой не настроен;
  # если задано частично — падает со списком недостающих переменных.
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/dev'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Resolve deploy configuration
      env:
        SECRET_DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        SECRET_DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        SECRET_DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        SECRET_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        SECRET_DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        SECRET_DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
      run: |
        set -euo pipefail
        set -a
        if [ -f .env ]; then . ./.env; set +a; fi

        HOST="${DEPLOY_HOST:-$SECRET_DEPLOY_HOST}"
        SSH_USER="${DEPLOY_USER:-$SECRET_DEPLOY_USER}"
        PORT="${DEPLOY_PORT:-${SECRET_DEPLOY_PORT:-22}}"
        DEPLOY_DIR="${STAGING_DEPLOY_PATH:-$SECRET_DEPLOY_PATH}"
        SSH_KEY="${DEPLOY_SSH_KEY:-$SECRET_DEPLOY_SSH_KEY}"
        KNOWN_HOSTS="${DEPLOY_SSH_KNOWN_HOSTS:-$SECRET_DEPLOY_KNOWN_HOSTS}"

        if [ -z "$HOST$SSH_USER$DEPLOY_DIR$SSH_KEY" ]; then
          echo "deploy_configured=none" >> "$GITHUB_ENV"
          echo "::notice::Деплой на staging не настроен: задайте DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY/STAGING_DEPLOY_PATH в .env или в repository secrets"
          exit 0
        fi

        MISSING=""
        for pair in "DEPLOY_HOST=$HOST" "DEPLOY_USER=$SSH_USER" "DEPLOY_SSH_KEY=$SSH_KEY" "STAGING_DEPLOY_PATH=$DEPLOY_DIR"; do
          name="${pair%%=*}"
          value="${pair#*=}"
          [ -n "$value" ] || MISSING="$MISSING $name"
        done
        if [ -n "$MISSING" ]; then
          echo "::error::Не заданы переменные деплоя:$MISSING"
          exit 1
        fi

        install -m 700 -d "$HOME/.ssh"
        # Многострочный ключ нельзя писать в GITHUB_ENV — сразу кладём в файл.
        printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
        chmod 600 "$HOME/.ssh/deploy_key"
        if [ -n "$KNOWN_HOSTS" ]; then
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
        else
          ssh-keyscan -p "$PORT" -H "$HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null || true
          if [ ! -s "$HOME/.ssh/known_hosts" ]; then
            echo "::error::Не удалось получить SSH host key для $HOST:$PORT — задайте DEPLOY_SSH_KNOWN_HOSTS"
            exit 1
          fi
        fi
        chmod 600 "$HOME/.ssh/known_hosts"

        {
          echo "deploy_configured=1"
          echo "DEPLOY_HOST=$HOST"
          echo "DEPLOY_USER=$SSH_USER"
          echo "DEPLOY_PORT=$PORT"
          echo "DEPLOY_DIR=$DEPLOY_DIR"
        } >> "$GITHUB_ENV"
        echo "Конфигурация деплоя на staging получена ($SSH_USER@$HOST:$PORT -> $DEPLOY_DIR)"

    - name: Deploy to staging over SSH
      if: env.deploy_configured == '1'
      run: |
        set -euo pipefail
        ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_DIR' && DEPLOY_GIT_PULL=1 DEPLOY_GIT_REF='$GITHUB_SHA' bash scripts/deploy.sh"

  # Деплой на production (ветка main)
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Resolve deploy configuration
      env:
        SECRET_DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        SECRET_DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        SECRET_DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        SECRET_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        SECRET_DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        SECRET_DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      run: |
        set -euo pipefail
        set -a
        if [ -f .env ]; then . ./.env; set +a; fi

        HOST="${DEPLOY_HOST:-$SECRET_DEPLOY_HOST}"
        SSH_USER="${DEPLOY_USER:-$SECRET_DEPLOY_USER}"
        PORT="${DEPLOY_PORT:-${SECRET_DEPLOY_PORT:-22}}"
        DEPLOY_DIR="${DEPLOY_PATH:-$SECRET_DEPLOY_PATH}"
        SSH_KEY="${DEPLOY_SSH_KEY:-$SECRET_DEPLOY_SSH_KEY}"
        KNOWN_HOSTS="${DEPLOY_SSH_KNOWN_HOSTS:-$SECRET_DEPLOY_KNOWN_HOSTS}"

        if [ -z "$HOST$SSH_USER$DEPLOY_DIR$SSH_KEY" ]; then
          echo "deploy_configured=none" >> "$GITHUB_ENV"
          echo "::notice::Деплой на production не настроен: задайте DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY/DEPLOY_PATH в .env или в repository secrets"
          exit 0
        fi

        MISSING=""
        for pair in "DEPLOY_HOST=$HOST" "DEPLOY_USER=$SSH_USER" "DEPLOY_SSH_KEY=$SSH_KEY" "DEPLOY_PATH=$DEPLOY_DIR"; do
          name="${pair%%=*}"
          value="${pair#*=}"
          [ -n "$value" ] || MISSING="$MISSING $name"
        done
        if [ -n "$MISSING" ]; then
          echo "::error::Не заданы переменные деплоя:$MISSING"
          exit 1
        fi

        install -m 700 -d "$HOME/.ssh"
        printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
        chmod 600 "$HOME/.ssh/deploy_key"
        if [ -n "$KNOWN_HOSTS" ]; then
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
        else
          ssh-keyscan -p "$PORT" -H "$HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null || true
          if [ ! -s "$HOME/.ssh/known_hosts" ]; then
            echo "::error::Не удалось получить SSH host key для $HOST:$PORT — задайте DEPLOY_SSH_KNOWN_HOSTS"
            exit 1
          fi
        fi
        chmod 600 "$HOME/.ssh/known_hosts"

        {
          echo "deploy_configured=1"
          echo "DEPLOY_HOST=$HOST"
          echo "DEPLOY_USER=$SSH_USER"
          echo "DEPLOY_PORT=$PORT"
          echo "DEPLOY_DIR=$DEPLOY_DIR"
        } >> "$GITHUB_ENV"
        echo "Конфигурация деплоя на production получена ($SSH_USER@$HOST:$PORT -> $DEPLOY_DIR)"

    - name: Deploy to production over SSH
      if: env.deploy_configured == '1'
      run: |
        set -euo pipefail
        ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_DIR' && DEPLOY_GIT_PULL=1 DEPLOY_GIT_REF='$GITHUB_SHA' bash scripts/deploy.sh"

  # Уведомления
  notify:
    runs-on: ubuntu-latest
    needs: [test, lint, build]
    if: always() && (needs.test.result == 'failure' || needs.lint.result == 'failure' || needs.build.result == 'failure')

    steps:
    - name: Notify on failure
      run: |
        echo "Pipeline failed! Check the logs for details."
        # Здесь можно добавить уведомления в Slack, Telegram, email и т.д.
