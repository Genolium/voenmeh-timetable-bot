name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '18'

jobs:
  # Тестирование
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock
        pip install -r requirements-dev.txt

    - name: Wait for databases
      run: |
        timeout 60 bash -c 'until nc -z localhost 5432; do sleep 1; done'
        timeout 60 bash -c 'until nc -z localhost 6379; do sleep 1; done'

    - name: Run migrations
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      run: |
        alembic upgrade head

    - name: Check migrations match models
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      run: |
        alembic check

    - name: Run tests with coverage
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/0
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        RUN_INTEGRATION: "1"
      run: |
        pytest --cov=bot --cov=core --cov-branch --cov-report=xml --cov-report=term-missing --cov-fail-under=100 --tb=short

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # Linting и проверка кода
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-lint-

    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run Black (code formatter)
      run: |
        black --check --diff bot/ core/ tests/ main.py

    - name: Run Flake8 (style checker)
      run: |
        flake8 bot/ core/ tests/ main.py --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 bot/ core/ tests/ main.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run isort (import sorter)
      run: |
        isort --check-only --diff bot/ core/ tests/ main.py

    - name: Run MyPy ratchet
      run: |
        python scripts/check_mypy_ratchet.py

    - name: Run Bandit (security linter)
      run: |
        bandit -r bot/ core/ -f json -o bandit-report.json || true
        bandit -r bot/ core/ -lll -s B324

    - name: Run pip-audit
      run: |
        pip-audit -r requirements.lock

    - name: Run pre-commit hooks
      run: |
        pre-commit run --all-files

  # Сборка Docker образов
  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'

    env:
      IMAGE_NAME: genolium/voenmeh-timetable-bot

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set up QEMU (multi-arch build)
      uses: docker/setup-qemu-action@v3

    # Все секреты проекта живут в .env. На раннере с .env (self-hosted)
    # читаем их оттуда; если раннер без .env — пробуем репозиторные секреты.
    - name: Resolve Docker Hub credentials
      env:
        SECRET_DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        SECRET_DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        set -a
        if [ -f .env ]; then
          . ./.env
          set +a
          echo "Файл .env найден — используем DOCKER_* из него"
        fi
        USERNAME="${DOCKER_USERNAME:-$SECRET_DOCKER_USERNAME}"
        PASSWORD="${DOCKER_PASSWORD:-$SECRET_DOCKER_PASSWORD}"
        if [ -n "$USERNAME" ] && [ -n "$PASSWORD" ]; then
          echo "DOCKER_USERNAME=$USERNAME" >> "$GITHUB_ENV"
          echo "DOCKER_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "docker_creds=available" >> "$GITHUB_ENV"
          echo "Креды найдены — образ будет опубликован"
        else
          echo "docker_creds=none" >> "$GITHUB_ENV"
          echo "Кредов нет — образ только собирается, публикация пропущена"
        fi

    - name: Log in to Docker Hub
      if: env.docker_creds == 'available'
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ env.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      if: env.docker_creds == 'available'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

    # Публикация недоступна (нет .env и нет репозиторных секретов) —
    # всё равно проверяем, что образ собирается.
    - name: Build Docker image (verification only)
      if: env.docker_creds != 'available'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64

  # Деплой на staging (для develop ветки)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/dev'

    steps:
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Здесь можно добавить команды для деплоя на staging
        # Например, через SSH, kubectl, docker-compose и т.д.

  # Деплой на production (для main ветки)
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # Здесь можно добавить команды для деплоя на production
        # Например, через SSH, kubectl, docker-compose и т.д.

  # Уведомления
  notify:
    runs-on: ubuntu-latest
    needs: [test, lint, build]
    if: always() && (needs.test.result == 'failure' || needs.lint.result == 'failure' || needs.build.result == 'failure')

    steps:
    - name: Notify on failure
      run: |
        echo "Pipeline failed! Check the logs for details."
        # Здесь можно добавить уведомления в Slack, Telegram, email и т.д.
