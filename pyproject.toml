[tool.black]
line-length = 127
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 127
# Уважаем "magic trailing comma" black, иначе isort схлопывает многострочные
# импорты, а black снова их разворачивает — бесконечный цикл правок.
split_on_trailing_comma = true
# Миграции alembic генерируются и правятся вручную, их не сортируем.
skip = ["migrations"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires Docker/testcontainers",
]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["bot", "core"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
exclude = "(migrations/|tests/|\\.venv/)"
