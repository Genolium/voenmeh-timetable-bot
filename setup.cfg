[flake8]
max-line-length = 127
max-complexity = 12
select = E,W,F
exclude =
    .git,
    __pycache__,
    migrations,
    tests,
    .pytest_cache,
    .mypy_cache,
    .tox,
    venv,
    .venv,
    env,
    .env,
    build,
    dist,
    *.egg-info

[bandit]
exclude_dirs = tests,migrations
skips = B101,B601,B324
