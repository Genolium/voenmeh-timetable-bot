apiVersion: 1

providers:
  - name: "default"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      # Явно укажем searchWildcards, чтобы Grafana не пыталась парсить YAML как JSON
      foldersFromFilesStructure: true
