default_language_version:
  python: python3

repos:
  # Black - Python code formatter
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=127]

  # Flake8 - Python style checker
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["--select=E9,F63,F7,F82"]
        exclude: ^(migrations/|tests/)

  # isort - Import sorter
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        # Настройки берём из pyproject.toml ([tool.isort]) — единый источник правды.
        # --filter-files нужен, чтобы skip из конфига применялся и к явному
        # списку файлов, который передаёт pre-commit.
        args: [--settings-path=pyproject.toml, --filter-files]

  # Bandit - Security linter
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-q", "-lll", "-s", "B324"]
        exclude: ^tests/

  # Trailing whitespace
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
